# Connexion au compte de démonstration. Identifiants passés à l'exécution,
# jamais écrits ici :  maestro test -e EMAIL=… -e PASSWORD=… .maestro/login.yaml
appId: com.horsetrack.app
---
- launchApp
- tapOn:
    text: "(Déjà un compte \\? Se connecter|Already have an account\\? Sign in)"
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    notVisible:
      id: "login-submit"
    timeout: 45000
- takeScreenshot: out/apres-connexion
