# Captures brutes pour l'App Store (cf. tools/store-screenshots/README.md).
# Lancé par tools/store-screenshots/capture.sh, qui fixe la barre d'état
# (9:41, batterie pleine) et range les images. Compte de DÉMONSTRATION
# Premium avec de vraies données (jamais un vrai client) : EMAIL, PASSWORD,
# et HORSE = nom du cheval principal si l'écurie en compte plusieurs.
appId: com.horsetrack.app
tags:
  - store
---
- runFlow: subflows/login.yaml
- waitForAnimationToEnd

# 1. Accueil
- tapOn:
    text: "Accueil|Today|Home"
- waitForAnimationToEnd
- takeScreenshot: today

# 2. Fiche du cheval (onglet Chevaux : la fiche s'affiche directement pour
#    un seul cheval, sinon on ouvre le cheval principal).
- tapOn:
    text: "Chevaux|Horses"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "hub-sante"
    commands:
      # La carte du cheval n'expose pas son nom à l'accessibilité : on touche
      # la première carte de la liste (le cheval principal).
      - tapOn:
          point: "50%,22%"
      - waitForAnimationToEnd
# L'état de l'abonnement se charge juste après la connexion et peut décaler la
# liste : si le paywall s'est ouvert par erreur, on le ferme et on réessaie.
- runFlow:
    when:
      visible: "Restaurer mes achats|Restore purchases"
    commands:
      - tapOn:
          point: "93%,8%"
      - waitForAnimationToEnd
      - tapOn:
          point: "50%,22%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "hub-sante"
    timeout: 20000
- takeScreenshot: hub

# 3. Santé
- tapOn:
    id: "hub-sante"
- waitForAnimationToEnd
# On fait défiler jusqu'aux soins et rendez-vous : c'est ce que promet le titre.
- swipe:
    start: 50%, 65%
    end: 50%, 45%
    duration: 400
- waitForAnimationToEnd
- takeScreenshot: sante
- swipe:
    start: 2%, 50%
    end: 90%, 50%
    duration: 300
- waitForAnimationToEnd

# 4. Budget
- tapOn:
    id: "hub-budget"
- waitForAnimationToEnd
- swipe:
    start: 50%, 65%
    end: 50%, 40%
    duration: 400
- waitForAnimationToEnd
- takeScreenshot: budget
- swipe:
    start: 2%, 50%
    end: 90%, 50%
    duration: 300
- waitForAnimationToEnd

# 5. Partage avec la demi-pension
- runFlow:
    when:
      visible:
        id: "hub-share"
    commands:
      - tapOn:
          id: "hub-share"
      - waitForAnimationToEnd
      - takeScreenshot: partage
      - swipe:
          start: 50%, 20%
          end: 50%, 95%
          duration: 300
      - waitForAnimationToEnd

# Retour de la fiche du cheval vers les onglets.
- swipe:
    start: 2%, 50%
    end: 90%, 50%
    duration: 300
- waitForAnimationToEnd

# 6. Planning
- tapOn:
    text: "Planning|Schedule"
- waitForAnimationToEnd
- takeScreenshot: planning

# 7. Journal
- tapOn:
    text: "Journal"
- waitForAnimationToEnd
- takeScreenshot: journal

# 8. Coach (Premium)
- tapOn:
    text: "Accueil|Today|Home"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "coach-open"
    direction: DOWN
- tapOn:
    id: "coach-open"
- waitForAnimationToEnd
# On pose une vraie question (suggestion) : la réponse vient du serveur.
- tapOn: "Combien de séances ce mois-ci ?"
- extendedWaitUntil:
    visible: "Texte-qui-n-existe-pas"
    timeout: 12000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: coach
