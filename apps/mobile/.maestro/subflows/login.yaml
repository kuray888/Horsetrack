# Connexion par email depuis l'écran d'accueil. EMAIL et PASSWORD : un compte
# de TEST (jamais un vrai client), cf. README.md.
appId: com.horsetrack.app
---
- runFlow: launch.yaml
- tapOn:
    id: "welcome-login"
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- pressKey: Enter
- tapOn:
    id: "login-submit"
    optional: true
# Les notifications ne sont jamais demandées au lancement (cf. today.tsx) :
# rien à fermer ici. L'Accueil est atteint quand l'onglet Profil est là.
- extendedWaitUntil:
    visible: "Profil|Profile"
    timeout: 45000
# Fenêtre système iOS « Enregistrer le mot de passe ? » : elle masque l'app
# et bloque les touches suivantes.
- extendedWaitUntil:
    visible: "Plus tard|Not Now"
    timeout: 10000
    optional: true
- tapOn:
    text: "Plus tard|Not Now"
    optional: true
