# Connexion par email depuis l'écran d'accueil. EMAIL et PASSWORD : un compte
# de TEST (jamais un vrai client), cf. README.md.
appId: com.horsetrack.app
---
- runFlow: launch.yaml
# Le toucher juste après le lancement peut se perdre (JavaScript pas prêt) :
# on le répète jusqu'à l'ouverture de l'écran de connexion.
- retry:
    maxRetries: 4
    commands:
      - tapOn:
          id: "welcome-login"
      - extendedWaitUntil:
          visible:
            id: "login-email"
          timeout: 6000
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- pressKey: Enter
- tapOn:
    id: "login-submit"
    optional: true
# Fenêtre système iOS « Enregistrer le mot de passe ? » : elle masque l'app
# et bloque les touches suivantes. Elle arrive avec un délai variable : on
# l'attend (ou l'Accueil), on la ferme, puis on vérifie l'Accueil.
- extendedWaitUntil:
    visible: "Plus tard|Not Now|Profil|Profile"
    timeout: 45000
# La fenêtre peut arriver quelques secondes après l'Accueil : on la laisse venir.
- extendedWaitUntil:
    visible: "Plus tard|Not Now"
    timeout: 8000
    optional: true
- tapOn:
    text: "Plus tard|Not Now"
    optional: true
# Les notifications ne sont jamais demandées au lancement (cf. today.tsx) :
# rien à fermer ici. L'Accueil est atteint quand l'onglet Profil est là.
- extendedWaitUntil:
    visible: "Profil|Profile"
    timeout: 45000
